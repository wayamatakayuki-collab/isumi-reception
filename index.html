<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>夷隅大会｜受付</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#142b3e;background:#edf3f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#f7fafb;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.header{background:linear-gradient(140deg,#09263a,#16465b);color:white;padding:calc(22px + env(safe-area-inset-top)) 22px 24px;border-radius:0 0 28px 28px}.over{font-size:11px;letter-spacing:.1em;color:#b4d2dc}.header h1{margin:9px 0;font-size:25px;letter-spacing:.02em}.status{display:flex;align-items:center;gap:8px;font-size:12px;color:#bde5d9}.dot{width:8px;height:8px;background:#bcd5e2;border-radius:50%}.dot.ok{background:#49e0a6}.section{padding:18px 18px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:white;border:1px solid #e2e9ee;border-radius:17px;padding:16px 8px;text-align:center;box-shadow:0 4px 16px #10283806}.stat b{display:block;font-size:27px;color:#173849}.stat b.good{color:#008568}.stat span{font-size:11px;color:#647b88}.panel{background:#fff;border:1px solid #e1e9ef;border-radius:22px;padding:18px;box-shadow:0 7px 25px #24445c0a}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:15px;background:#eff4f7;margin-bottom:18px}.tab{background:transparent;color:#536b7b;border:0;border-radius:12px;padding:13px 4px;font-weight:700;font-size:14px}.tab.active{background:#fff;color:#103f57;box-shadow:0 2px 9px #19344c18}.btn{border:0;border-radius:14px;padding:16px 17px;font-weight:800;font-size:16px;cursor:pointer}.primary{color:#fff;background:#117b9b;width:100%}.secondary{background:#eff6f8;color:#155b70;width:100%}.btn:disabled{opacity:.5}.camera{position:relative;overflow:hidden;background:#0d2834;border-radius:18px;aspect-ratio:1.22;display:flex;justify-content:center;align-items:center;color:white}.camera video{object-fit:cover}.camera .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:#e1f6fb;background:#102b3699;padding:7px}.scan-lines{border:2px solid #87e9cc;width:56%;height:57%;border-radius:18px}.muted{font-size:13px;color:#708594;line-height:1.6}.field{width:100%;border:1px solid #ccdae3;border-radius:13px;padding:15px 14px;font-size:17px;background:#fff;outline-color:#167999}.person{border:1px solid #d8e6ed;border-radius:15px;padding:14px;margin-top:9px;text-align:left;background:#fff;width:100%}.person b{font-size:17px}.person small{display:block;color:#6e8290;margin-top:6px;font-size:12px}.tag{display:inline-block;background:#e5f6ee;color:#167958;border-radius:7px;padding:4px 7px;font-size:11px;margin-top:7px}.tag.done{background:#fff0da;color:#9a6819}.result{border-radius:16px;padding:21px 18px;margin-top:16px;display:none}.result.visible{display:block}.result.ok{background:#e8f8ef;color:#075e44}.result.dup{background:#fff4df;color:#845400}.result.bad{background:#ffe8e5;color:#a12c29}.result h2{margin:0 0 8px;font-size:21px}.result strong{font-size:19px}.result .secondaryText{font-size:12px;margin-top:8px}.hidden{display:none!important}#error{display:none;border-radius:12px;background:#fff0e9;color:#aa402e;padding:12px;font-size:13px;margin-top:14px}.foot{text-align:center;color:#8798a4;font-size:11px;padding:18px}.busy{opacity:.6;pointer-events:none}#fileInput{display:none}#scanArea{width:100%;min-height:260px}#scanArea video{border-radius:16px}#scanArea>div{border:0!important}.pill{font-size:12px;background:#e1eef3;color:#28556b;border-radius:99px;padding:6px 10px}button{touch-action:manipulation}
</style></head>
<body><div class="wrap"><header class="header"><div class="over">第61回 千葉県教育研究会 国語教育部会</div><h1>夷隅大会 受付</h1><div class="status"><span class="dot" id="dot"></span><span id="connection">接続を確認しています</span></div></header>
<section class="section"><div class="summary"><div class="stat"><b id="total">—</b><span>申込者</span></div><div class="stat"><b class="good" id="checked">—</b><span>受付済</span></div><div class="stat"><b id="pending">—</b><span>未受付</span></div></div></section>
<section class="section"><div class="panel"><div class="tabs"><button class="tab active" id="qrTab" onclick="switchTab('qr')">▣ QR受付</button><button class="tab" id="manualTab" onclick="switchTab('manual')">⌕ 手入力受付</button></div>
<div id="qrPanel"><div class="camera" id="cameraBox"><div class="scan-lines"></div><div class="hint">参加者のQRコードを枠内にかざしてください</div></div><div id="scanArea" class="hidden"></div><div style="height:12px"></div><button class="btn primary" id="cameraButton" onclick="toggleCamera()">カメラを起動する</button><div style="height:10px"></div><button class="btn secondary" onclick="document.getElementById('fileInput').click()">画像からQRを読み取る</button><input id="fileInput" type="file" accept="image/*" onchange="scanFile(event)"><p class="muted">読み取り後に自動受付します。次の方へ進む前に受付結果を確認してください。</p></div>
<div id="manualPanel" class="hidden"><label for="query"><b>氏名・所属校・受付番号で検索</b></label><div style="height:10px"></div><input class="field" id="query" placeholder="例：山田、夷隅小、ISUMI-00001" autocomplete="off"><div style="height:10px"></div><button class="btn primary" id="searchButton" onclick="searchManual()">名簿を検索する</button><div id="results"></div><p class="muted">同姓同名の方に注意し、所属を必ず確認してください。</p></div>
<div id="error"></div><div class="result" id="result"><h2 id="resultTitle"></h2><strong id="resultName"></strong><div id="resultSchool" style="margin-top:7px"></div><div id="resultNote" class="secondaryText"></div></div>
</div></section><div class="foot">夷隅大会事務局｜受付担当者専用</div></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* 事務局が最初の1回だけここを設定。PINも各役員の手入力設定も不要。 */
const GAS_URL='https://script.google.com/macros/s/AKfycbw57Ft2_sCg89UC10UAFSgJhZzA_hNR8ztvJ1uFRi8hDDqcJ3EVe9DLyoogTALSEqA/exec';
const token=(new URLSearchParams(location.hash.slice(1))).get('station')||'';
let scanner=null,scanning=false,processing=false,lastToken='',lastAt=0,searchResults=[],currentTab='qr',fileScanner=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(s){el('error').textContent=s;el('error').style.display='block'}
function clearError(){el('error').style.display='none'}
function api(op,args={}){return new Promise((resolve,reject)=>{
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL))return reject(Error('事務局でApps ScriptのURLがまだ設定されていません。'));
 if(!/^[a-f0-9]{64}$/.test(token))return reject(Error('受付専用URLが必要です。事務局から配付されたURLを開いてください。'));
 const cb='isumiCb_'+Date.now()+'_'+Math.floor(Math.random()*1e8),script=document.createElement('script');let timer;let settled=false;
 function finish(err,value){if(settled)return;settled=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(value)}
 window[cb]=data=>finish(null,data);
 const u=new URL(GAS_URL);Object.entries({op,station:token,callback:cb,...args,_:Date.now()}).forEach(([k,v])=>u.searchParams.set(k,v));
 script.src=u.href;script.onerror=()=>finish(Error('Googleとの通信に失敗しました。公開設定と通信環境を確認してください。'));
 timer=setTimeout(()=>finish(Error('通信がタイムアウトしました。もう一度お試しください。')),18000);
 document.head.appendChild(script);
})}
function updateStats(s){if(!s)return;el('total').textContent=s.total;el('checked').textContent=s.checked;el('pending').textContent=s.pending}
async function boot(){try{const res=await api('ping');if(!res.ok)throw Error(res.error||'接続できません');el('dot').classList.add('ok');el('connection').textContent=(res.station||'受付端末')+'・接続済';updateStats(res.summary);clearError()}catch(e){el('connection').textContent='接続待ち';error(e.message)}}
function switchTab(t){currentTab=t;el('qrPanel').classList.toggle('hidden',t!=='qr');el('manualPanel').classList.toggle('hidden',t!=='manual');el('qrTab').classList.toggle('active',t==='qr');el('manualTab').classList.toggle('active',t==='manual');el('result').className='result';clearError();if(t==='manual')stopCamera()}
function showResult(r){const node=el('result');node.className='result visible '+(r.duplicate?'dup':r.ok?'ok':'bad');el('resultTitle').textContent=r.duplicate?'すでに受付済みです':r.ok?'✓ 受付完了':'受付できませんでした';el('resultName').textContent=r.person?.name||'';el('resultSchool').textContent=r.person?.school||'';el('resultNote').textContent=r.duplicate?'受付時刻：'+(r.person.time||'記録済み'):r.ok?'受付時刻：'+(r.person.time||''):r.error||'';if(r.summary)updateStats(r.summary);if(navigator.vibrate)navigator.vibrate(r.ok&&!r.duplicate?80:[80,60,80]);if(r.ok&&!r.duplicate)beep()}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=960;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.13);setTimeout(()=>a.close(),250)}catch(e){}}
async function doCheckin(mode,value){if(processing)return;processing=true;clearError();try{const r=await api('checkin',{mode,value});showResult(r)}catch(e){showResult({ok:false,error:e.message})}finally{processing=false}}
function onScan(decoded){const t=Date.now();if(processing||(decoded===lastToken&&t-lastAt<4200))return;lastToken=decoded;lastAt=t;doCheckin('qr',decoded)}
async function toggleCamera(){if(scanning){await stopCamera();return}clearError();if(typeof Html5Qrcode==='undefined'){error('QR読取ライブラリを読み込めませんでした。通信環境をご確認ください。');return}try{el('cameraBox').classList.add('hidden');el('scanArea').classList.remove('hidden');scanner=new Html5Qrcode('scanArea',{verbose:false});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{});scanning=true;el('cameraButton').textContent='カメラを停止する'}catch(e){error('カメラを起動できません。Safariのカメラ許可をご確認ください。 '+e.message);await stopCamera()}}
async function stopCamera(){try{if(scanner&&scanning)await scanner.stop()}catch(e){}try{if(scanner)scanner.clear()}catch(e){}scanner=null;scanning=false;el('cameraBox').classList.remove('hidden');el('scanArea').classList.add('hidden');el('cameraButton').textContent='カメラを起動する'}
async function scanFile(ev){const f=ev.target.files?.[0];ev.target.value='';if(!f)return;try{if(scanning)await stopCamera();if(typeof Html5Qrcode==='undefined')throw Error('読取ライブラリを読み込めません');el('scanArea').classList.remove('hidden');if(!fileScanner)fileScanner=new Html5Qrcode('scanArea');const val=await fileScanner.scanFile(f,true);onScan(val);if(!scanning)el('scanArea').classList.add('hidden')}catch(e){error('画像からQRを検出できませんでした。 '+e.message)}}
async function searchManual(){const q=el('query').value.trim();if(q.length<2){error('検索は2文字以上で入力してください。');return}clearError();el('results').textContent='検索しています…';try{const r=await api('search',{q});if(!r.ok)throw Error(r.error);searchResults=r.results||[];if(!searchResults.length){el('results').textContent='該当する参加者は見つかりませんでした。';return}el('results').innerHTML=searchResults.map((p,i)=>`<button class="person" onclick="choose(${i})"><b>${esc(p.name)}</b><small>${esc(p.school)} ・ ${esc(p.id)}</small><span class="tag ${p.status==='受付済'?'done':''}">${esc(p.status)}</span></button>`).join('')}catch(e){el('results').textContent='';error(e.message)}}
function choose(index){const p=searchResults[index];if(!p)return;const ok=confirm('次の参加者を受付しますか？\n\n'+p.name+'\n'+p.school+'\n'+p.id+'\n\n所属と氏名を確認してからOKを押してください。');if(ok)doCheckin('manual',p.id)}
el('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchManual()});boot();setInterval(()=>{if(!processing)api('summary').then(r=>{if(r.ok)updateStats(r.summary)}).catch(()=>{})},45000);
</script></body></html>
