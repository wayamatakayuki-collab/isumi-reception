<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>夷隅大会 | スマート受付</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#172c3c;background:#edf1f3;font-synthesis:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:580px;margin:auto;min-height:100dvh;background:#f6f8f9;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.header{background:#123044;color:white;padding:calc(19px + env(safe-area-inset-top)) 20px 20px}.eyebrow{font-size:10px;letter-spacing:.12em;color:#bad2df;font-weight:700}.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}.header h1{font-size:23px;font-weight:850;letter-spacing:.015em;margin:0}.connect{display:flex;align-items:center;gap:5px;background:#244658;padding:8px 9px;border-radius:100px;font-size:11px;white-space:nowrap;max-width:46%}.connect-text{overflow:hidden;text-overflow:ellipsis}.dot{height:7px;width:7px;border-radius:50%;background:#f6b353;flex:none}.dot.ok{background:#57e2ab}.meta{margin:14px 18px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:white;border:1px solid #e0e8ed;border-radius:15px;padding:11px 7px;text-align:center}.metric b{display:block;font-size:23px;line-height:1.2;letter-spacing:-.04em;color:#18384a;font-variant-numeric:tabular-nums}.metric b.green{color:#087b62}.metric span{font-size:11px;color:#647985}.workspace{margin:14px 14px 0;padding:14px;background:#fff;border:1px solid #e1e7eb;border-radius:20px;box-shadow:0 9px 25px #163d5410}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-title strong{font-size:16px;letter-spacing:.01em}.small-pill{font-size:10px;font-weight:700;border-radius:99px;padding:6px 9px;background:#eaf5f0;color:#167c61}.tabs{background:#eef2f4;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:13px;margin-bottom:15px}.tab{border:0;background:transparent;color:#52697b;border-radius:10px;padding:12px 5px;font-size:14px;font-weight:750}.tab.active{color:#113d50;background:#fff;box-shadow:0 2px 8px #163b4b12}.camera-shell{position:relative;background:#0b202e;border-radius:15px;overflow:hidden;height:clamp(260px,43dvh,355px);isolation:isolate}.camera-shell::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,#34516355,transparent 70%);pointer-events:none}.camera-placeholder{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;color:#c7d7de}.camera-placeholder svg{width:58px;height:58px;stroke:#7edbc0;stroke-width:1.7;fill:none}.camera-placeholder span{font-size:14px}.camera-shell.is-running .camera-placeholder{display:none}.scan-area{position:absolute;inset:0;width:100%!important;height:100%!important;overflow:hidden!important;background:#071a26}.scan-area[hidden]{display:none!important}.scan-area>div{height:100%!important;max-height:100%!important;border:none!important;padding:0!important;margin:0!important;overflow:hidden!important}.scan-area video{display:block!important;width:100%!important;height:100%!important;max-height:none!important;object-fit:cover!important;border-radius:0!important}.scan-area canvas{max-width:100%!important}.camera-shell .reticle{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}.camera-shell:not(.is-running) .reticle{display:none}.reticle div{width:min(55%,215px);aspect-ratio:1;border:2px solid #8fe8cc;border-radius:22px;box-shadow:0 0 0 200px #05172125;position:relative}.reticle div::after{content:"";position:absolute;top:50%;left:10%;right:10%;height:2px;background:#98edd4;box-shadow:0 0 14px #62f7d4;opacity:.5}.camera-caption{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;padding:10px 12px;border-radius:9px;text-align:center;color:white;background:#0d283bc9;font-size:13px;font-weight:700;pointer-events:none}.stack{display:grid;gap:9px;margin-top:12px}.btn{border:0;border-radius:13px;min-height:51px;padding:13px 17px;font-size:15px;font-weight:800}.btn-primary{color:#fff;background:#156b87}.btn-secondary{color:#155671;background:#e8f2f6}.btn-outline{border:1px solid #d0dde4;color:#315c72;background:#fff}.btn:disabled{opacity:.6}.notice{font-size:12px;line-height:1.7;color:#6a7e8c;margin:11px 2px 0}.field-label{font-size:13px;font-weight:750;display:block;margin-bottom:8px}.field{width:100%;background:#fff;border:1px solid #cddce5;outline-color:#1685a2;border-radius:12px;padding:14px 13px;font-size:16px}.person{display:block;text-align:left;background:white;width:100%;border:1px solid #dce6eb;padding:14px;margin-top:9px;border-radius:13px}.person b{font-size:16px}.person small{display:block;color:#637b89;margin-top:5px;font-size:12px}.person em{font-style:normal;font-size:11px;display:inline-block;margin-top:7px;padding:4px 7px;border-radius:7px;background:#e4f4eb;color:#177b5e}.person em.done{background:#fff0d8;color:#9b650b}.muted{font-size:12px;color:#6b8190;line-height:1.65}.hidden{display:none!important}#error{display:none;background:#fff0ed;color:#a63b32;border-radius:11px;font-size:13px;margin-top:12px;padding:12px;line-height:1.6}.footer{text-align:center;color:#8b9aa3;font-size:11px;padding:18px}.overlay{position:fixed;z-index:9999;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#091b2de0;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}.overlay.visible{opacity:1;visibility:visible}.modal{width:100%;max-width:420px;background:#fff;border-radius:25px;padding:24px;text-align:center;box-shadow:0 20px 70px #06111e66;max-height:calc(100dvh - 45px);overflow:auto}.symbol{width:71px;height:71px;margin:3px auto 15px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;background:#e5f2fc;color:#156d9c}.overlay.success .symbol{background:#e1f7ec;color:#09805f}.overlay.duplicate .symbol{background:#fff0da;color:#b0710b}.overlay.failure .symbol{background:#ffe7e4;color:#ae302c}.kicker{font-size:11px;font-weight:800;color:#7a8e9b;letter-spacing:.11em}.modal h2{font-size:25px;line-height:1.4;margin:7px 0 15px;color:#143344}.overlay.success h2{color:#087b61}.overlay.duplicate h2{color:#a16b10}.overlay.failure h2{color:#b03a30}.person-name{font-size:23px;font-weight:850;overflow-wrap:anywhere}.person-school{color:#647985;font-size:13px;margin-top:8px;overflow-wrap:anywhere}.modal-note{background:#f1f5f7;border-radius:11px;color:#516779;font-size:13px;line-height:1.6;margin-top:15px;padding:12px;overflow-wrap:anywhere}.modal .btn{width:100%;margin-top:17px}.modal .muted{min-height:15px;margin-bottom:0}.overlay.loading .modal .btn{display:none}.confirm-actions{display:none;gap:8px;margin-top:12px}.overlay.confirm .confirm-actions{display:grid;grid-template-columns:1fr 1fr}.overlay.confirm #modalNext{display:none}.overlay.confirm .modal-note{background:#fff5e8}body.modal-open{overflow:hidden}@media(max-width:370px){.header h1{font-size:20px}.workspace{padding:11px}.modal h2{font-size:22px}}@media(prefers-reduced-motion:reduce){.overlay{transition:none}}
</style></head>
<body>
<main class="app">
<header class="header"><div class="eyebrow">第61回 千葉県教育研究会 国語教育部会</div><div class="header-row"><h1>夷隅大会 <span style="font-weight:450">受付</span></h1><div class="connect"><span class="dot" id="dot"></span><span class="connect-text" id="connection">接続確認中</span></div></div></header>
<section class="meta" aria-label="受付状況"><div class="metric"><b id="total">—</b><span>申込者</span></div><div class="metric"><b class="green" id="checked">—</b><span>受付済</span></div><div class="metric"><b id="pending">—</b><span>未受付</span></div></section>
<section class="workspace"><div class="section-title"><strong>チェックイン</strong><span class="small-pill">スタッフ専用</span></div>
<div class="tabs" role="tablist" aria-label="受付方法"><button class="tab active" type="button" id="qrTab" role="tab" aria-selected="true">▣ QRを読み取る</button><button class="tab" type="button" id="manualTab" role="tab" aria-selected="false">⌕ 手入力で受付</button></div>
<div id="qrPanel" role="tabpanel"><div class="camera-shell" id="cameraShell"><div class="camera-placeholder" id="placeholder"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 25V12a4 4 0 0 1 4-4h13M39 8h13a4 4 0 0 1 4 4v13M56 39v13a4 4 0 0 1-4 4H39M25 56H12a4 4 0 0 1-4-4V39M12 32h40M19 19h11v11H19zM36 35h10v10H36z"/></svg><span>カメラを起動してQRを読み取る</span></div><div id="scanArea" class="scan-area" hidden></div><div class="reticle"><div></div></div><div class="camera-caption" id="cameraCaption">カメラは停止しています</div></div><div class="stack"><button class="btn btn-primary" type="button" id="cameraButton">カメラを起動する</button><button class="btn btn-secondary" type="button" id="imageButton">画像からQRを読み取る</button><input id="fileInput" type="file" accept="image/*" hidden></div><p class="notice">受付成功は緑、受付済みはオレンジの画面でお知らせします。読み取り画面の高さは切り替えても変わりません。</p></div>
<div id="manualPanel" role="tabpanel" class="hidden"><label class="field-label" for="query">参加者を検索</label><input class="field" type="search" id="query" placeholder="氏名・所属校・受付番号" autocomplete="off" enterkeyhint="search"><div class="stack"><button type="button" class="btn btn-primary" id="searchButton">名簿を検索する</button></div><div id="results" aria-live="polite"></div><p class="notice">同姓同名の方がいる場合もあります。氏名と所属を確認してから確定してください。</p></div>
<div id="error" role="alert"></div></section><div class="footer">第61回 夷隅大会事務局 · RECEPTION</div>
</main>
<div class="overlay" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal"><div class="symbol" id="modalSymbol">✓</div><div class="kicker" id="modalKicker">受付結果</div><h2 id="modalTitle">受付完了</h2><div class="person-name" id="modalName"></div><div class="person-school" id="modalSchool"></div><div class="modal-note" id="modalNote"></div><button class="btn btn-primary" type="button" id="modalNext">次の方を読み取る</button><div class="confirm-actions" id="confirmActions"><button class="btn btn-outline" id="cancelConfirm" type="button">戻る</button><button class="btn btn-primary" id="acceptConfirm" type="button">受付を確定</button></div><p class="muted" id="modalCountdown"></p></div></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* 事務局が一度だけ設定。既存の受付URLの #station=... はそのまま利用。 */
const GAS_URL='https://script.google.com/macros/s/AKfycbw57Ft2_sCg89UC10UAFSgJhZzA_hNR8ztvJ1uFRi8hDDqcJ3EVe9DLyoogTALSEqA/exec';
const station=(new URLSearchParams(location.hash.slice(1))).get('station')||'';
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scanner=null,scanning=false,cameraBusy=false,processing=false,modalActive=false,modalTimer=null,modalTick=null,lastCode='',lastTime=0,currentTab='qr',searchResults=[],pendingPerson=null;
function error(message){el('error').textContent=message;el('error').style.display='block'}
function clearError(){el('error').textContent='';el('error').style.display='none'}
function api(op,args={}){return new Promise((resolve,reject)=>{
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL))return reject(Error('事務局でGoogle Apps ScriptのURLを設定してください。'));
 if(!/^[a-f0-9]{64}$/.test(station))return reject(Error('受付専用URLが必要です。事務局から配付されたURLを開いてください。'));
 const callback='isumiCb_'+Date.now()+'_'+Math.floor(Math.random()*1e8),script=document.createElement('script');let timer,finished=false;
 function finish(err,value){if(finished)return;finished=true;clearTimeout(timer);try{delete window[callback]}catch(_){window[callback]=undefined}script.remove();err?reject(err):resolve(value)}
 window[callback]=data=>finish(null,data);
 const url=new URL(GAS_URL);Object.entries({op,station,callback,...args,_:Date.now()}).forEach(([k,v])=>url.searchParams.set(k,v));script.src=url.href;
 script.onerror=()=>finish(Error('通信に失敗しました。通信環境とGASの公開設定をご確認ください。'));
 timer=setTimeout(()=>finish(Error('応答がありません。通信環境を確認して再度お試しください。')),18000);
 document.head.appendChild(script);
})}
function updateStats(s){if(!s)return;el('total').textContent=s.total;el('checked').textContent=s.checked;el('pending').textContent=s.pending}
async function boot(){try{const r=await api('ping');if(!r.ok)throw Error(r.error||'接続できません');el('dot').classList.add('ok');el('connection').textContent=(r.station||'受付端末')+' · 接続済';updateStats(r.summary);clearError()}catch(e){el('connection').textContent='接続待ち';error(e.message)}}
function modal(kind,{name='',school='',note='',autoMs=0}={}){
 clearTimeout(modalTimer);clearInterval(modalTick);modalActive=true;
 const m=el('resultModal');m.className='overlay visible '+kind;m.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');
 const cfg={success:['✓','受付完了','CHECK-IN COMPLETE'],duplicate:['!','すでに受付済みです','ALREADY CHECKED IN'],failure:['×','受付できませんでした','CHECK-IN ERROR'],loading:['…','受付を確認中','PROCESSING'],confirm:['?','この方を受付しますか？','CONFIRM CHECK-IN']}[kind];
 el('modalSymbol').textContent=cfg[0];el('modalTitle').textContent=cfg[1];el('modalKicker').textContent=cfg[2];el('modalName').textContent=name;el('modalSchool').textContent=school;el('modalNote').textContent=note;
 el('modalNext').textContent=kind==='failure'?'閉じて再試行':kind==='loading'?'処理中…':'次の方を受付する';el('modalCountdown').textContent='';
 if(autoMs){const ends=Date.now()+autoMs;const tick=()=>{let secs=Math.max(0,Math.ceil((ends-Date.now())/1000));el('modalCountdown').textContent=secs?`${secs}秒後に自動で次へ`:''};tick();modalTick=setInterval(tick,250);modalTimer=setTimeout(closeModal,autoMs)}
}
function closeModal(){clearTimeout(modalTimer);clearInterval(modalTick);modalTimer=null;modalTick=null;modalActive=false;pendingPerson=null;const m=el('resultModal');m.className='overlay';m.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=920;g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.14);o.start();o.stop(a.currentTime+.14);setTimeout(()=>a.close(),300)}catch(_){}}
function showResult(r){const kind=r.duplicate?'duplicate':r.ok?'success':'failure';const p=r.person||{};const note=r.duplicate?'受付時刻：'+(p.time||'受付履歴に記録済み'):r.ok?'受付時刻：'+(p.time||'記録済み'):(r.error||'再度お試しください');modal(kind,{name:p.name||'',school:p.school||'',note,autoMs:kind==='success'?2500:kind==='duplicate'?4200:0});if(r.summary)updateStats(r.summary);if(navigator.vibrate)navigator.vibrate(kind==='success'?85:[120,70,120]);if(kind==='success')beep()}
async function doCheckin(mode,value){if(processing||modalActive)return;processing=true;clearError();modal('loading',{note:'参加者名簿を確認しています'});try{const r=await api('checkin',{mode,value});showResult(r)}catch(e){showResult({ok:false,error:e.message})}finally{processing=false}}
function onScan(code){const now=Date.now();if(processing||modalActive||(code===lastCode&&now-lastTime<5000))return;lastCode=code;lastTime=now;doCheckin('qr',code)}
function setCameraUi(on){el('cameraShell').classList.toggle('is-running',on);el('scanArea').hidden=!on;el('cameraCaption').textContent=on?'QRコードを枠内にかざしてください':'カメラは停止しています';el('cameraButton').textContent=on?'カメラを停止する':'カメラを起動する'}
async function startCamera(){if(cameraBusy||scanning)return;if(typeof Html5Qrcode==='undefined'){error('QR読取プログラムを取得できません。インターネット接続をご確認ください。');return}cameraBusy=true;clearError();try{
 // カメラを固定サイズの専用領域に描画。毎回コンテナの状態を初期化する。
 el('scanArea').innerHTML='';setCameraUi(true);
 scanner=new Html5Qrcode('scanArea',{verbose:false});const width=el('cameraShell').clientWidth;const height=el('cameraShell').clientHeight;const box=Math.floor(Math.max(120,Math.min(width,height)*.62));
 await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:box,height:box},aspectRatio:width/height},onScan,()=>{});
 scanning=true;
 if(currentTab!=='qr')await teardownCamera();
 }catch(e){error('カメラを起動できませんでした。カメラの許可・ブラウザ設定をご確認ください。 '+(e.message||''));await teardownCamera()}finally{cameraBusy=false}}
async function teardownCamera(){const old=scanner;scanner=null;scanning=false;try{if(old&&old.isScanning)await old.stop()}catch(_){}try{if(old)old.clear()}catch(_){}el('scanArea').innerHTML='';setCameraUi(false)}
async function stopCamera(){if(cameraBusy)return;cameraBusy=true;try{await teardownCamera()}finally{cameraBusy=false}}
async function toggleCamera(){if(scanning)await stopCamera();else await startCamera()}
async function switchTab(tab){
 if(tab===currentTab)return;
 closeModal();clearError();
 if(currentTab==='qr'&&(scanning||scanner)){await stopCamera()}
 currentTab=tab;
 el('qrPanel').classList.toggle('hidden',tab!=='qr');el('manualPanel').classList.toggle('hidden',tab!=='manual');
 for(const [id,active] of [['qrTab',tab==='qr'],['manualTab',tab==='manual']]){el(id).classList.toggle('active',active);el(id).setAttribute('aria-selected',String(active))}
 if(tab==='qr')await startCamera();
}
async function scanFile(ev){const file=ev.target.files?.[0];ev.target.value='';if(!file)return;if(typeof Html5Qrcode==='undefined'){error('読取プログラムを取得できませんでした。');return}clearError();try{
 if(scanning)await stopCamera();const fileArea=document.createElement('div');fileArea.id='temporaryFileScan';fileArea.style.display='none';document.body.appendChild(fileArea);let fileReader;
 try{fileReader=new Html5Qrcode('temporaryFileScan',{verbose:false});const code=await fileReader.scanFile(file,true);onScan(code)}finally{try{fileReader?.clear()}catch(_){}fileArea.remove()}
 }catch(e){error('画像にQRコードが見つかりませんでした。 '+(e.message||''))}}
async function searchManual(){const q=el('query').value.trim();if(q.length<2){error('2文字以上で検索してください。');return}clearError();el('results').textContent='検索しています…';try{const r=await api('search',{q});if(!r.ok)throw Error(r.error||'検索に失敗しました');searchResults=r.results||[];if(!searchResults.length){el('results').textContent='該当する参加者が見つかりません。';return}el('results').innerHTML=searchResults.map((p,i)=>`<button type="button" class="person" data-index="${i}"><b>${esc(p.name)}</b><small>${esc(p.school)} · ${esc(p.id)}</small><em class="${p.status==='受付済'?'done':''}">${esc(p.status)}</em></button>`).join('')}catch(e){el('results').textContent='';error(e.message)}}
function choose(index){const p=searchResults[index];if(!p)return;pendingPerson=p;modal('confirm',{name:p.name,school:p.school,note:'受付番号：'+p.id+'。氏名と所属を確認して確定してください。'})}
function acceptConfirm(){if(!pendingPerson)return;const id=pendingPerson.id;closeModal();doCheckin('manual',id)}
el('qrTab').addEventListener('click',()=>switchTab('qr'));el('manualTab').addEventListener('click',()=>switchTab('manual'));el('cameraButton').addEventListener('click',toggleCamera);el('imageButton').addEventListener('click',()=>el('fileInput').click());el('fileInput').addEventListener('change',scanFile);el('searchButton').addEventListener('click',searchManual);el('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchManual()});el('results').addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(b)choose(Number(b.dataset.index))});el('modalNext').addEventListener('click',closeModal);el('cancelConfirm').addEventListener('click',closeModal);el('acceptConfirm').addEventListener('click',acceptConfirm);
boot();setInterval(()=>{if(!processing)api('summary').then(r=>{if(r.ok)updateStats(r.summary)}).catch(()=>{})},45000);
</script></body></html>
