<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>夷隅大会 | セルフ受付</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#142e43;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}.mast{background:#0b2a43;color:white;padding:20px 3.5vw;display:flex;align-items:center;justify-content:space-between;gap:15px}.mast small{font-weight:650;letter-spacing:.08em;color:#bad2e1}.mast h1{font-size:clamp(25px,2.1vw,36px);margin:4px 0 0}.live{padding:11px 17px;border-radius:100px;background:#234559;color:#fff;font-weight:700;white-space:nowrap}.live:before{content:'';display:inline-block;width:10px;height:10px;margin-right:9px;border-radius:50%;background:#e5a75f}.live.ok:before{background:#48d3a4}.main{width:min(1460px,100%);margin:auto;display:grid;grid-template-columns:minmax(370px,1.15fr) minmax(360px,.85fr);gap:2.3vw;padding:2.2vw;flex:1;align-items:center}.panel{background:white;padding:25px;border-radius:24px;box-shadow:0 12px 42px #0b314410}.heading{font-size:clamp(19px,1.6vw,25px);font-weight:800;margin:0 0 19px}.eyebrow{font-weight:800;letter-spacing:.12em;color:#127b82;font-size:13px}.hero{font-size:clamp(30px,3.3vw,54px);line-height:1.32;letter-spacing:-.035em;margin:13px 0 18px}.muted{color:#5b7180;line-height:1.75;font-size:18px}.camera{position:relative;border-radius:18px;background:#0d273a;overflow:hidden;aspect-ratio:4/3;min-height:290px}.camera #reader{position:absolute;inset:0;width:100%!important;height:100%!important}.camera video{width:100%!important;height:100%!important;object-fit:cover!important}.camera #reader>div{height:100%!important;overflow:hidden!important}.focus{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}.focus>div{height:min(63%,300px);aspect-ratio:1;border:5px solid #63e5c5;border-radius:27px;box-shadow:0 0 0 800px #01121d55}.camera-text{position:absolute;bottom:14px;left:14px;right:14px;border-radius:10px;background:#092637d9;color:white;font-size:18px;padding:11px;text-align:center;font-weight:700}.primary{background:#096f85;color:#fff;padding:17px 25px;border-radius:13px;font-weight:800;font-size:20px;min-height:62px}.primary:disabled{background:#a1b4bd;cursor:not-allowed}.outline{background:#ebf2f5;color:#1a526b;padding:15px 24px;border-radius:13px;font-weight:750;font-size:18px;min-height:58px}.controls{display:flex;gap:12px;margin-top:16px}.controls button{flex:1}.steps{display:grid;gap:15px;margin:27px 0}.step{display:flex;gap:15px;align-items:center;font-weight:700;font-size:18px}.step b{display:grid;place-items:center;flex:0 0 42px;height:42px;background:#e4f4f3;color:#117d7a;border-radius:50%}.footer{font-size:13px;color:#718392;padding:12px 3vw}.overlay{position:fixed;inset:0;background:#081d2dea;z-index:20;display:none;align-items:center;justify-content:center;padding:25px;backdrop-filter:blur(8px)}.overlay.visible{display:flex}.dialog{background:#fff;width:min(760px,100%);border-radius:28px;padding:clamp(28px,4vw,58px);text-align:center;box-shadow:0 25px 95px #061c2e85}.dialog .topline{font-weight:800;letter-spacing:.08em;color:#147b89;font-size:15px}.person{background:#f1f6f9;border-radius:20px;padding:clamp(26px,4vw,46px) 20px;margin:25px 0;text-align:center;border:1px solid #dce8ef}.person span{display:block;font-size:17px;color:#5d7384;margin-bottom:12px;font-weight:700;text-align:center}.person strong{display:block;font-size:clamp(36px,5.3vw,66px);line-height:1.25;letter-spacing:.02em;color:#12364b;text-align:center;overflow-wrap:anywhere}.person .school{font-size:clamp(26px,3.5vw,42px);font-weight:800;line-height:1.4;margin-top:8px;color:#12364b;text-align:center;overflow-wrap:anywhere}.dialog h2{font-size:clamp(32px,4vw,54px);margin:13px 0;color:#14354b}.dialog p{font-size:20px;line-height:1.6;color:#526d7c}.dialog .buttons{display:flex;gap:15px;margin-top:22px}.dialog .buttons button{flex:1}.symbol{font-size:63px;font-weight:800;color:#087f61}.overlay.duplicate .symbol,.overlay.duplicate h2{color:#9c6a13}.overlay.failure .symbol,.overlay.failure h2{color:#bd4237}.overlay.success .symbol,.overlay.success h2{color:#0c875f}.hidden{display:none!important}@media(max-width:850px){.main{grid-template-columns:1fr;padding:16px;align-content:start}.panel{padding:20px}.mast{padding:16px}.mast h1{font-size:23px}.mast small{font-size:10px}.live{font-size:12px;padding:8px}.camera{min-height:240px;aspect-ratio:4/3}.hero{font-size:30px}.dialog .buttons{flex-direction:column}.dialog{padding:25px}.step{font-size:15px}}
</style></head><body>
<div class="app"><header class="mast"><div><small>第61回 千葉県教育研究会 国語教育部会</small><h1>夷隅大会｜セルフ受付</h1></div><div class="live" id="connection">接続確認中</div></header>
<main class="main"><section class="panel"><h2 class="heading">QRコードをカメラに向けてください</h2><div class="camera"><div id="reader"></div><div class="focus"><div></div></div><div class="camera-text" id="cameraLabel">カメラを開始してください</div></div><div class="controls"><button class="primary" id="cameraButton">カメラを開始</button><button class="outline" id="retryButton">接続を確認</button></div><div id="cameraError" role="status" aria-live="polite" style="display:none;margin-top:12px;padding:14px 16px;border-radius:12px;background:#fff1eb;color:#8c3424;font-weight:700;line-height:1.6"></div></section>
<section class="panel"><div class="eyebrow">SELF CHECK-IN</div><h2 class="hero">お名前を確認して、<br>受付完了。</h2><p class="muted">お申し込み時のQRコードを読み込むと、氏名と所属が表示されます。ご本人の情報に間違いがないか確認してください。</p><div class="steps"><div class="step"><b>1</b> QRコードをかざす</div><div class="step"><b>2</b> 氏名・所属校を確認する</div><div class="step"><b>3</b> 「はい、受付する」を押す</div></div></section></main><footer class="footer">第61回 千葉県教育研究会 国語教育部会 夷隅大会 · 受付システム</footer></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="topline" id="dialogLabel">内容確認</div><div class="symbol hidden" id="symbol">✓</div><h2 id="dialogTitle">お申し込み内容の確認</h2><div class="person" id="personCard"><span>氏名</span><strong id="personName"></strong><span style="margin-top:14px">所属校・所属</span><div class="school" id="personSchool"></div></div><p id="dialogNote">氏名・所属をご確認のうえ、ボタンを選択してください。</p><div class="buttons"><button id="cancelButton" class="outline">いいえ、戻る</button><button id="confirmButton" class="primary">はい、受付する</button><button id="nextButton" class="primary hidden">次の方へ</button></div><p id="countdown" style="font-size:14px"></p></div></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
// v4.0のWebアプリURLを入れてください。Google Apps Scriptも同梱版へ更新してください。
const GAS_URL='https://script.google.com/macros/s/AKfycbw57Ft2_sCg89UC10UAFSgJhZzA_hNR8ztvJ1uFRi8hDDqcJ3EVe9DLyoogTALSEqA/exec';
const station=new URLSearchParams(location.hash.slice(1)).get('station')||'';
const $=id=>document.getElementById(id);
let reader=null,running=false,busy=false,modal=false,phase='ready',selectedCode='',selectedPerson=null,timer=0,lastCode='',holdUntil=0;
function api(op,args={}){return new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL))return reject(Error('GAS_URL未設定'));if(!/^[a-f0-9]{64}$/.test(station))return reject(Error('端末URLが不正です'));const cb='isumiCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let complete=false;const timeout=setTimeout(()=>finish(Error('通信がタイムアウトしました')),18000);function finish(err,val){if(complete)return;complete=true;clearTimeout(timeout);try{delete window[cb]}catch(e){}script.remove();err?reject(err):resolve(val)}window[cb]=data=>finish(null,data);const url=new URL(GAS_URL);Object.entries({op,station,callback:cb,...args,_:Date.now()}).forEach(([k,v])=>url.searchParams.set(k,v));script.onerror=()=>finish(Error('接続できません'));script.src=url.href;document.head.appendChild(script)})}
function dialog(type,person,note){modal=true;phase=type;clearTimeout(timer);$('overlay').className='overlay visible '+type;$('dialogLabel').textContent=type==='confirm'?'ご本人確認':'受付結果';$('personCard').classList.toggle('hidden',!person);if(person){$('personName').textContent=person.name||'';$('personSchool').textContent=person.school||''}$('symbol').classList.toggle('hidden',type==='confirm'||type==='loading');$('symbol').textContent=type==='duplicate'?'!':type==='failure'?'×':'✓';$('dialogTitle').textContent=({confirm:'こちらの氏名・所属で受付してよろしいですか？',loading:'受付処理中です',success:'受付が完了しました',duplicate:'すでに受付済みです',failure:'受付を確認できません'})[type];$('dialogNote').textContent=note||({confirm:'氏名・所属をご確認のうえ、ボタンを選択してください。',loading:'そのままお待ちください。',success:'ありがとうございました。そのままお進みください。',duplicate:'受付はすでに完了しています。受付係にお声かけください。',failure:'近くの受付係にお声かけください。'})[type];$('cancelButton').classList.toggle('hidden',type!=='confirm');$('confirmButton').classList.toggle('hidden',type!=='confirm');$('nextButton').classList.toggle('hidden',type==='confirm'||type==='loading');$('countdown').textContent='';if(type==='success'||type==='duplicate'){const secs=type==='success'?4000:6000;timer=setTimeout(reset,secs);$('countdown').textContent=Math.round(secs/1000)+'秒後に次の方へ戻ります。'}}
function reset(){clearTimeout(timer);$('overlay').className='overlay';modal=false;phase='ready';busy=false;selectedCode='';selectedPerson=null;holdUntil=Date.now()+4500}
async function onScan(code){if(busy||modal||Date.now()<holdUntil||(code===lastCode&&Date.now()<holdUntil))return;busy=true;lastCode=code;$('cameraLabel').textContent='参加者情報を照会しています…';try{const r=await api('preview',{value:code});if(!r.ok){dialog('failure',null,r.error||'登録情報を確認できません');return}selectedCode=code;selectedPerson=r.person;if(r.person.status==='受付済'){dialog('duplicate',r.person,'この方はすでに受付済みです。');return}dialog('confirm',r.person)}catch(e){dialog('failure',null,'通信できませんでした。受付係をお呼びください。')}finally{busy=false;$('cameraLabel').textContent='QRコードを枠内に向けてください'}}
async function confirm(){if(phase!=='confirm'||busy||!selectedCode)return;busy=true;$('confirmButton').disabled=true;dialog('loading',null);try{const r=await api('checkin',{mode:'qr',value:selectedCode});if(r.duplicate)dialog('duplicate',r.person||selectedPerson);else if(r.ok)dialog('success',r.person||selectedPerson);else dialog('failure',null,r.error||'受付を確定できませんでした')}catch(e){dialog('failure',null,'通信が不安定です。再度かざさず、受付係へお声かけください。')}finally{busy=false;$('confirmButton').disabled=false}}
async function ping(){try{const r=await api('ping');if(!r.ok)throw Error(r.error||'接続失敗');$('connection').classList.add('ok');$('connection').textContent='受付できます';return true}catch(e){$('connection').classList.remove('ok');$('connection').textContent='接続を確認してください';return false}}
function showCameraError(message){const el=$('cameraError');el.style.display='block';el.textContent=message;$('cameraLabel').textContent='カメラの起動を確認してください'}
function clearCameraError(){$('cameraError').style.display='none';$('cameraError').textContent=''}
function cameraErrorMessage(e){const name=e&&e.name||'',detail=e&&e.message||'';
 if(!window.isSecureContext)return 'このページは安全なHTTPS接続ではありません。GitHub Pagesの https:// で始まるURLから開いてください。';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'このブラウザではカメラが利用できません。ChromeまたはEdgeで開いてください。';
 if(name==='NotAllowedError'||name==='PermissionDeniedError')return 'カメラが許可されていません。アドレスバー左側のサイト設定でカメラを「許可」に変更し、ページを再読み込みしてください。';
 if(name==='NotFoundError'||name==='DevicesNotFoundError')return '使用できるカメラが見つかりません。内蔵カメラまたはUSBカメラの接続を確認してください。';
 if(name==='NotReadableError'||name==='TrackStartError')return '別のアプリがカメラを使用している可能性があります。Zoom・Teamsなどを終了して再試行してください。';
 if(name==='OverconstrainedError')return '指定されたカメラを開けません。別のカメラを選ぶか、ページを再読み込みしてください。';
 return 'カメラを起動できませんでした（'+(name||'不明なエラー')+'）。'+(detail?detail.slice(0,160):'ブラウザのカメラ設定を確認してください。');
}
async function startCamera(){
 if(running)return;
 clearCameraError();
 $('cameraButton').disabled=true;
 $('cameraLabel').textContent='カメラを起動しています…';
 try{
  if(!window.isSecureContext)throw new Error('HTTPSが必要です');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('カメラ非対応');
  if(!window.Html5Qrcode)throw new Error('QR読取ライブラリが読み込まれていません。通信環境を確認してください');
  reader=new Html5Qrcode('reader',{verbose:false});
  const width=$('reader').clientWidth,height=$('reader').clientHeight;
  const size=Math.max(140,Math.min(300,Math.floor(Math.min(width,height)*.65)));
  const config={fps:12,qrbox:{width:size,height:size},aspectRatio:4/3};
  // PCの内蔵カメラ・USBカメラはfacingModeを固定せず最初の映像デバイスを選択する。
  let cameras=[];
  try{cameras=await Html5Qrcode.getCameras()}catch(err){/* startで詳細を判定する */}
  const device=cameras.length?cameras[0].id:{facingMode:'user'};
  await reader.start(device,config,onScan,()=>{});
  running=true;
  $('cameraLabel').textContent='QRコードを枠内に向けてください';
  $('cameraButton').textContent='カメラを停止';
  $('cameraButton').onclick=stopCamera;
  // 接続の確認はカメラ起動とは独立。接続できなくてもカメラは動く。
  ping();
 }catch(e){
  console.error('Camera start failed',e);
  showCameraError(cameraErrorMessage(e));
  if(reader){try{reader.clear()}catch(x){} reader=null}
 }finally{$('cameraButton').disabled=false}
}
async function stopCamera(){if(!reader)return;try{if(reader.isScanning)await reader.stop();reader.clear()}catch(e){}reader=null;running=false;$('cameraButton').textContent='カメラを開始';$('cameraButton').onclick=startCamera;$('cameraLabel').textContent='カメラを開始してください'}
$('cameraButton').onclick=startCamera;$('retryButton').onclick=ping;$('confirmButton').onclick=confirm;$('cancelButton').onclick=()=>{reset();holdUntil=Date.now()+5000};$('nextButton').onclick=reset;ping();
</script></body></html>
